<!DOCTYPE html>
<!-- AERODROME :: index.html :: v1.4.1 -->
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AERODROME</title>
<meta name="description" content="A browser flight simulator rendered as if it were running on a Sega Genesis.">
<style>
/* AERODROME :: chrome styles :: v1.4.1
   UI chrome is exempt from the 64 color constraint. Everything inside the
   canvas is not. */
:root {
  --field: #0A0F0D;
  --deck: #121A16;
  --deck2: #18221D;
  --line: #2A382F;
  --paper: #DFE8DF;
  --muted: #93A69A;
  --lamp: #F0B040;
  --sig: #7ED6A8;
  --flag: #E4695B;
  --gate: #000000;
  --radius: 2px;
  --display: "Haettenschweiler", "Arial Narrow", "Franklin Gothic Medium", "Liberation Sans Narrow", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", Menlo, Consolas, monospace;
}
html[data-theme="day"] {
  --field: #DDE3DC; --deck: #EDF1EA; --deck2: #E2E8DF; --line: #A8B5A9;
  --paper: #14201A; --muted: #45564B; --lamp: #8A4B06; --sig: #17603C; --flag: #A32717; --gate: #2A322C;
}
html[data-theme="contrast"] {
  --field: #000000; --deck: #000000; --deck2: #0B0B0B; --line: #FFFFFF;
  --paper: #FFFFFF; --muted: #E8E8E8; --lamp: #FFD400; --sig: #6BFFB0; --flag: #FF6A5A; --gate: #000000;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--field); color: var(--paper); }
body {
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.45;
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}
h1, h2, h3, .placard {
  font-family: var(--display);
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-weight: 400;
  margin: 0;
}
a { color: var(--lamp); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
  outline: 2px solid var(--lamp);
  outline-offset: 2px;
}
.skip {
  position: absolute; left: -9999px; top: 0; background: var(--deck); color: var(--paper);
  padding: 10px 14px; z-index: 20;
}
.skip:focus { left: 8px; top: 8px; }

header.bar {
  display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline;
  padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--deck);
}
header.bar h1 { font-size: 26px; letter-spacing: 0.3em; }
.stamp { color: var(--muted); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
#status { margin: 0; color: var(--sig); font-size: 12px; min-height: 18px; }
#status[data-kind="warn"] { color: var(--flag); }

main.layout {
  display: grid;
  grid-template-columns: 218px minmax(0, 1fr);
  gap: 14px;
  padding: 14px;
  align-items: start;
}
@media (max-width: 900px) {
  main.layout { grid-template-columns: minmax(0, 1fr); }
  #rail { max-height: none; }
  #roster { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 6px; }
  #roster .tag { min-width: 170px; }
}

/* The flight line rail. Each tag is a stencilled placard for one airframe. */
#rail { border: 1px solid var(--line); background: var(--deck); padding: 10px; }
#rail > .placard { font-size: 15px; color: var(--muted); margin-bottom: 8px; }
#roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tag button {
  width: 100%; text-align: left; background: var(--deck2); color: var(--paper);
  border: 1px solid var(--line); border-left: 3px solid var(--line);
  padding: 8px 10px; min-height: 44px; cursor: pointer; font-family: var(--mono); font-size: 12px;
}
.tag button:hover { border-left-color: var(--lamp); }
.tag button[aria-pressed="true"] { border-left-color: var(--lamp); background: var(--field); color: var(--lamp); }
.tag .name { font-family: var(--display); letter-spacing: 0.12em; font-size: 15px; display: block; }
.tag .kind { color: var(--muted); font-size: 11px; display: block; }
.caps { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
.cap { border: 1px solid var(--line); color: var(--muted); font-size: 9px; padding: 1px 4px; letter-spacing: 0.1em; }

#gate {
  background: var(--gate); border: 1px solid var(--line); padding: 10px;
  display: grid; gap: 10px;
}
#screen {
  width: 100%; display: block; background: #000; image-rendering: pixelated;
  image-rendering: crisp-edges; aspect-ratio: 320 / 224; touch-action: none;
}
#screen.tall { aspect-ratio: 320 / 240; }
.quickbar { display: flex; flex-wrap: wrap; gap: 6px; }
.quickbar button, .row button, .row select, .row input[type="file"] {
  min-height: 44px; background: var(--deck2); color: var(--paper); border: 1px solid var(--line);
  padding: 6px 12px; font-family: var(--mono); font-size: 12px; cursor: pointer;
}
.quickbar button[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }
.quickbar button[hidden] { display: none; }
.quickbar button:disabled { opacity: 0.55; cursor: default; }
button.tiny {
  min-height: 28px; padding: 2px 8px; font-size: 11px; background: var(--deck2);
  color: var(--muted); border: 1px solid var(--line); font-family: var(--mono); cursor: pointer;
}
button.tiny:hover { color: var(--lamp); border-color: var(--lamp); }
.mark { color: var(--lamp); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; min-width: 54px; }
p.firstrun {
  border: 1px solid var(--line); border-left: 3px solid var(--lamp);
  padding: 8px 10px; margin: 0; color: var(--paper); background: var(--deck);
}
details.drawer.sub { border-left: 3px solid var(--line); margin: 6px 0; background: var(--deck2); }
details.drawer.sub > summary { font-size: 13px; letter-spacing: 0.14em; min-height: 38px; }
details.drawer.sub[open] { border-left-color: var(--lamp); }

#drawers { padding: 0 14px 20px; display: grid; gap: 10px; }
footer#legend span { display: inline-flex; align-items: center; gap: 4px; }
details.drawer { border: 1px solid var(--line); background: var(--deck); }
details.drawer > summary {
  cursor: pointer; padding: 10px 12px; min-height: 44px; display: flex; align-items: center; gap: 10px;
  font-family: var(--display); text-transform: uppercase; letter-spacing: 0.18em; font-size: 15px;
}
details.drawer > summary::marker { color: var(--lamp); }
.drawer-body { padding: 4px 12px 14px; border-top: 1px solid var(--line); }
.hint { color: var(--muted); font-size: 11px; margin: 6px 0 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
.row label { min-width: 190px; color: var(--muted); letter-spacing: 0.06em; }
input[type="range"] { flex: 1 1 180px; accent-color: var(--lamp); min-height: 32px; }
input[type="number"], input[type="text"], select {
  background: var(--deck2); color: var(--paper); border: 1px solid var(--line); padding: 6px 8px;
  font-family: var(--mono); font-size: 12px; min-height: 36px; width: 110px;
}
.value { color: var(--lamp); min-width: 72px; display: inline-block; }
table.map { border-collapse: collapse; width: 100%; font-size: 12px; }
table.map th, table.map td { text-align: left; border-bottom: 1px solid var(--line); padding: 6px 8px; }
table.map th { color: var(--muted); font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px; }
table.map button { min-height: 36px; }
pre.log {
  background: var(--deck2); border: 1px solid var(--line); padding: 10px; overflow: auto;
  max-height: 260px; font-size: 12px; white-space: pre-wrap; color: var(--paper);
}
.pass { color: var(--sig); }
.fail { color: var(--flag); }
footer.bar {
  border-top: 1px solid var(--line); padding: 10px 14px; color: var(--muted); font-size: 11px;
  display: flex; flex-wrap: wrap; gap: 14px;
}
kbd {
  border: 1px solid var(--line); padding: 0 4px; background: var(--deck2); color: var(--paper);
  font-family: var(--mono); font-size: 11px;
}
/* Small controls stay small under a mouse and grow to a full touch target on
   a touch screen, so the 44 pixel rule holds where it actually matters. */
@media (pointer: coarse) {
  button.tiny, table.map button, input[type="number"], input[type="text"], select {
    min-height: 44px;
  }
  .row label { min-width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<a class="skip" href="#screen">Skip to the aircraft</a>

<header class="bar">
  <h1>Aerodrome</h1>
  <span class="stamp" id="versionStamp">v1.4.1</span>
  <span class="stamp">320 x 224 &middot; 64 colors &middot; GPL-3.0</span>
</header>

<main class="layout">
  <aside id="rail" aria-label="Aircraft roster">
    <h2 class="placard">Flight line</h2>
    <ul id="roster"></ul>
  </aside>

  <section id="gate" aria-label="Viewport">
    <canvas id="screen" width="960" height="672" tabindex="0"
            aria-label="Flight viewport. Use the flight controls listed in the controls drawer."></canvas>
    <div class="quickbar" id="quickbar"></div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
</main>

<section id="drawers" aria-label="Settings"></section>

<footer class="bar" id="legend" aria-label="Keys for the selected aircraft"></footer>

<!-- Load order matters. These are classic script tags on purpose: ES modules
     do not load from file://, so the project uses one global namespace. -->
<script src="src/00-core.js"></script>
<script src="src/01-palette.js"></script>
<script src="src/02-raster.js"></script>
<script src="src/03-render.js"></script>
<script src="src/04-audio.js"></script>
<script src="src/05-flight.js"></script>
<script src="src/06-aircraft.js"></script>
<script src="src/07-world.js"></script>
<script src="src/08-weather.js"></script>
<script src="src/09-camera.js"></script>
<script src="src/10-instruments.js"></script>
<script src="src/11-input.js"></script>
<script src="src/12-storage.js"></script>
<script src="src/13-tests.js"></script>
<script src="src/14-ui.js"></script>
<script src="src/15-main.js"></script>
</body>
</html>
